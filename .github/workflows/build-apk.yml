name: Build APK

on:
  push:
    branches:
      - claude/lockscreen-couple-app-is9lo0
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Erica-e-Erick.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Erica-e-Erick-APK
          path: out/Erica-e-Erick.apk
          if-no-files-found: error

      - name: Publish APK to 'apk' branch
        run: |
          cd out
          git init -q
          git checkout -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Erica-e-Erick.apk
          git commit -q -m "APK build ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
