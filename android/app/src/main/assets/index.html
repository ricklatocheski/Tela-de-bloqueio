<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Erica e Erick 💕</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --accent: #ff5c8a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Foto de fundo */
    #bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }
    /* Leve escurecimento só nas pontas, para o texto respirar */
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg,
        rgba(0,0,0,.45) 0%,
        rgba(0,0,0,.05) 20%,
        rgba(0,0,0,0) 45%,
        rgba(0,0,0,.15) 80%,
        rgba(0,0,0,.55) 100%);
    }

    #content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--safe-top) + 9vh) 22px calc(var(--safe-bottom) + 20px);
    }

    /* Relógio + data */
    #clock {
      font-size: clamp(58px, 19vw, 104px);
      font-weight: 300;
      letter-spacing: -1px;
      line-height: 1.02;
      text-shadow: 0 2px 22px rgba(0,0,0,.45);
      font-variant-numeric: tabular-nums;
    }
    #date {
      margin-top: 10px;
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 400;
      letter-spacing: .2px;
      opacity: .92;
      text-shadow: 0 1px 12px rgba(0,0,0,.55);
    }
    .alarm {
      margin-top: 8px;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13.5px; font-weight: 500; opacity: .85;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 10px rgba(0,0,0,.5);
    }
    .alarm.hidden { display: none; }
    .alarm .al-ic { font-size: 13px; }

    /* Notificação estilo WhatsApp */
    .notif {
      width: 100%;
      max-width: 440px;
      margin-top: 24px;
      background: rgba(0,0,0,.34);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-radius: 20px;
      padding: 11px 13px 13px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }
    .notif.hidden { display: none; }
    #notif2 { margin-top: 10px; }
    .notif.show-pop { animation: notifIn .5s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes notifIn { from{opacity:0; transform:translateY(-12px) scale(.97);} to{opacity:1; transform:none;} }
    .notif-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .notif-app { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #eaeaea; }
    .wa-icon {
      width: 19px; height: 19px; border-radius: 5px; background: #25D366;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .notif-time { font-size: 12.5px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
    .notif-body { display: flex; align-items: center; gap: 11px; }
    .notif-avatar {
      width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
      background: linear-gradient(135deg,#ffb3c9,#ff5c8a) center/cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
      cursor: pointer; overflow: hidden;
      display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
    }
    .notif-avatar:active { transform: scale(.94); }
    .notif-text { min-width: 0; }
    .notif-name {
      font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .notif-msg { font-size: 14.5px; color: rgba(255,255,255,.92); line-height: 1.3; }

    .spacer { flex: 1 1 auto; }

    /* Rodapé mínimo: nomes + contador discreto */
    .footer { text-align: center; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
    .footer .names {
      font-size: clamp(15px, 4.4vw, 18px);
      font-weight: 600;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .footer .names .h { color: var(--accent); font-size: .85em; }
    .footer .count {
      margin-top: 4px;
      font-size: 12.5px;
      opacity: .85;
      font-variant-numeric: tabular-nums;
    }

    /* Botão trocar foto de fundo */
    #photoBtn {
      position: absolute;
      top: calc(var(--safe-top) + 14px);
      right: 14px;
      z-index: 3;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: .5; transition: opacity .2s;
    }
    #photoBtn:active { opacity: 1; transform: scale(.95); }

    /* Corações caindo — bem sutil */
    #hearts { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .heart-fall {
      position: absolute; top: -8%;
      will-change: transform, opacity;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0%   { transform: translateY(-10vh); opacity: 0; }
      15%  { opacity: .8; }
      85%  { opacity: .8; }
      100% { transform: translateY(112vh); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-fall { display: none; }
    }

    /* Data especial (aniversários, dia dos namorados) */
    .special {
      margin-top: 8px; max-width: 90%;
      font-size: 13.5px; font-weight: 600; color: #fff;
      background: rgba(255,92,138,.28);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px; padding: 5px 14px;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
      animation: hintPulse 2.2s ease-in-out infinite;
    }
    .special.hidden { display: none; }
    @keyframes hintPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

    /* Motivo do dia */
    .reason {
      margin-top: 8px; max-width: 340px;
      font-size: 12px; opacity: .82; line-height: 1.35;
      text-shadow: 0 1px 8px rgba(0,0,0,.55);
    }
    .reason.hidden { display: none; }

    /* Botão de bilhetinho */
    #noteBtn {
      position: absolute;
      top: calc(var(--safe-top) + 14px);
      left: 14px; z-index: 3;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: .55; transition: opacity .2s;
    }
    #noteBtn:active { opacity: 1; transform: scale(.95); }

    /* Bilhetinho revelado */
    #notePop {
      position: absolute; z-index: 10;
      top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.9);
      max-width: 82%; text-align: center;
      background: rgba(20,10,20,.82);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px; padding: 18px 22px;
      color: #fff; font-size: 16px; line-height: 1.4;
      box-shadow: 0 16px 50px rgba(0,0,0,.5);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    }
    #notePop.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    #notePop.hidden { display: none; }

    /* Confete */
    #confetti { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .confetti-piece {
      position: absolute; top: -6%; width: 9px; height: 14px; border-radius: 2px;
      will-change: transform, opacity; animation: confFall linear forwards;
    }
    @keyframes confFall {
      0% { transform: translateY(-8vh) rotate(0deg); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translateY(112vh) rotate(720deg); opacity: .9; }
    }

    /* "usar senha" (reserva) no rodapé */
    #usePin {
      margin-top: 10px;
      color: #fff; opacity: .6; font-size: 12px; text-decoration: underline;
      text-shadow: 0 1px 8px rgba(0,0,0,.6); cursor: pointer;
    }

    /* Player do Spotify */
    .np {
      width: 100%; max-width: 440px; margin-top: 14px;
      display: flex; align-items: center; gap: 11px;
      background: rgba(0,0,0,.32);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px; padding: 9px 12px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: #fff;
    }
    .np.hidden { display: none; }
    .np-art {
      width: 44px; height: 44px; border-radius: 10px; flex: 0 0 auto;
      background: linear-gradient(135deg,#1DB954,#0f7a37) center/cover no-repeat;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      overflow: hidden;
    }
    .np-info { flex: 1 1 auto; min-width: 0; }
    .np-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-artist { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-ctrl { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .np-btn {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; background: rgba(255,255,255,.12); cursor: pointer; user-select: none;
    }
    .np-btn:active { background: rgba(255,255,255,.28); }

    /* Teclado de senha */
    #pinLayer {
      position: absolute; inset: 0; z-index: 9;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 20px;
      transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    }
    #pinLayer.show { transform: none; }
    .pin-title { color: #fff; font-size: 16px; opacity: .95; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
    .pin-dots { display: flex; gap: 16px; }
    .pin-dots .d { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); transition: background .15s; }
    .pin-dots .d.on { background: #fff; }
    #pinLayer.err .pin-dots { animation: shake .38s; }
    @keyframes shake { 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 16px; }
    .key {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.20);
      color: #fff; font-size: 27px; font-weight: 300;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      user-select: none;
    }
    .key:active { background: rgba(255,255,255,.32); transform: scale(.96); }
    .key.fn { font-size: 13px; letter-spacing: .3px; background: transparent; border-color: transparent; }
  </style>
</head>
<body>
  <div id="app">
    <div id="bg"></div>
    <div id="overlay"></div>
    <div id="hearts"></div>
    <div id="confetti"></div>

    <button id="photoBtn" title="Trocar foto de fundo" aria-label="Trocar foto de fundo">📷</button>
    <button id="noteBtn" title="Bilhetinho" aria-label="Bilhetinho">💌</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" />

        </div>
        <div class="np-ctrl">
          <span class="np-btn" data-m="prev">⏮</span>
          <span class="np-btn" id="npPlay" data-m="toggle">▶</span>

    <div id="pinLayer">
      <div class="pin-title">Digite a senha 💕</div>
      <div class="pin-dots">
        <span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span>

        <div class="key" data-k="4">4</div>
        <div class="key" data-k="5">5</div>
        <div class="key" data-k="6">6</div>
        <div class="key" data-k="7">7</div>

      </div>
    </div>
  </div>

  <script>
    var START_DATE = new Date(2025, 1, 1, 0, 0, 0); // 01/02/2025

    // Datas especiais (formato 'dd-mm'). Preencher ANIVERSÁRIO DELA / DELE:
    var DATES = {
      namoro:    '01-02',   // aniversário de namoro

    function pad(n){ return n < 10 ? '0' + n : '' + n; }
    function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

    function rnd(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

    // Frases fofas por período do dia

    };

    var REASONS = [

    ];

    // Bilhetinhos escondidos
    var NOTES = [
      'Se você tá lendo isso, saiba que eu te amo demais ❤️',

    ];

    function periodo(h){
      if (h >= 5 && h < 12)  return 'manha';
      if (h >= 12 && h < 18) return 'tarde';
      if (h >= 18 && h < 23) return 'noite';
      return 'dormir';
    }

    function ddmm(now){ return pad(now.getDate()) + '-' + pad(now.getMonth() + 1); }

    function checkSpecial(now){
      var t = ddmm(now);
      if (DATES.namoro && t === DATES.namoro){
        var y = now.getFullYear() - 2025;
        return { id: 'namoro',
          title: '🎉 Hoje é nosso aniversário de namoro! 💑',
          msg: 'Feliz aniversário de namoro meu amor ❤️ ' + y + ' ano' + (y === 1 ? '' : 's') + ' de nós dois 🥹💕' };
      }
      if (DATES.ela && t === DATES.ela){
        return { id: 'ela', title: '🎂 Feliz aniversário, meu amor! 🎉',
          msg: 'Parabéns meu amor 🎂❤️ que sua vida seja tão linda quanto você. Te amo infinito 🥰' };

      if (DATES.ele && t === DATES.ele){
        return { id: 'ele', title: '🎂 Feliz aniversário, meu amor! 🎉',
          msg: 'Parabéns meu amor 🎂❤️ hoje é o seu dia. Te amo demais 🥰' };
      }
      if (DATES.namorados && t === DATES.namorados){
        return { id: 'namorados', title: '💘 Feliz Dia dos Namorados! 💘',
          msg: 'Feliz dia dos namorados meu amor ❤️ obrigada por ser meu pra sempre 💑' };
      }
      return null;
    }

    var _msgKey = null;
    function refreshMsg(now){
      var sp = checkSpecial(now);
      var key = sp ? ('sp:' + sp.id) : periodo(now.getHours());
      if (key !== _msgKey){
        _msgKey = key;
        document.getElementById('notifMsg').textContent = sp ? sp.msg : rnd(FRASES[periodo(now.getHours())]);
      }
    }

    // Banner de data especial + confete
    var _specialOn = false, _confTimer = null;
    function startConfetti(){
      if (_confTimer) return;
      var layer = document.getElementById('confetti');
      var cores = ['#ff5c8a','#ffd166','#06d6a0','#4d9dff','#c77dff','#ff9770','#ffffff'];
      _confTimer = setInterval(function(){
        var s = document.createElement('span');
        s.className = 'confetti-piece';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.background = cores[Math.floor(Math.random() * cores.length)];
        var dur = 2.6 + Math.random() * 2.6;
        s.style.animationDuration = dur + 's';
        layer.appendChild(s);
        setTimeout(function(){ s.remove(); }, dur * 1000 + 200);
      }, 130);
    }
    function stopConfetti(){ if (_confTimer){ clearInterval(_confTimer); _confTimer = null; } }

    function updateSpecialUI(now){
      var sp = checkSpecial(now);
      var el = document.getElementById('special');
      if (sp && !_specialOn){
        _specialOn = true; el.textContent = sp.title; el.classList.remove('hidden'); startConfetti();
      } else if (!sp && _specialOn){
        _specialOn = false; el.classList.add('hidden'); stopConfetti();
      }
    }

    // Motivo do dia pra te amar
    var _reasonDay = null;
    function updateReason(now){
      var days = Math.floor((now - START_DATE) / 86400000);
      if (days === _reasonDay) return;
      _reasonDay = days;
      var n = ((days % REASONS.length) + REASONS.length) % REASONS.length;
      var el = document.getElementById('reason');
      el.textContent = 'Motivo nº ' + (days + 1) + ' pra te amar: ' + REASONS[n];
      el.classList.remove('hidden');
    }

    function tick(){
      var now = new Date();

      document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
      document.getElementById('date').textContent =
        cap(DIAS[now.getDay()]) + ', ' + now.getDate() + ' de ' + MESES[now.getMonth()] + ' de ' + now.getFullYear();

      refreshMsg(now);
      updateSpecialUI(now);
      updateReason(now);
      document.getElementById('notifTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());

      var totalDays = Math.floor((now - START_DATE) / 86400000);
      document.getElementById('count').textContent =
        'juntos há ' + totalDays.toLocaleString('pt-BR') + ' dias · desde 01/02/2025';
    }

    // ===== Foto de fundo =====
    var bg = document.getElementById('bg');
    function applyPhoto(src){ bg.style.backgroundImage = "url('" + src + "')"; }
    function loadPhoto(){
      var saved = null;
      try { saved = localStorage.getItem('couplePhoto'); } catch(e){}
      if (saved) { applyPhoto(saved); return; }
      var img = new Image();
      img.onload = function(){ applyPhoto('foto.jpg'); };
      img.onerror = function(){
        bg.style.background = 'radial-gradient(120% 120% at 30% 20%, #3a1c3f 0%, #1a1030 55%, #0a0812 100%)';
      };
      img.src = 'foto.jpg';
    }
    document.getElementById('photoBtn').addEventListener('click', function(){
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function(ev){
        applyPhoto(ev.target.result);
        try { localStorage.setItem('couplePhoto', ev.target.result); } catch(err){}
      };
      r.readAsDataURL(file);
    });

    // ===== Foto dela (avatar) =====
    var notifAvatar = document.getElementById('notifAvatar');
    function applyAvatar(src){
      notifAvatar.style.backgroundImage = "url('" + src + "')"; notifAvatar.textContent = '';
      var a2 = document.getElementById('notif2Avatar');
      if (a2){ a2.style.backgroundImage = "url('" + src + "')"; a2.textContent = ''; }
    }
    function loadAvatar(){
      var saved = null;
      try { saved = localStorage.getItem('gfPhoto'); } catch(e){}
      if (saved) { applyAvatar(saved); return; }
      var img = new Image();
      img.onload = function(){ applyAvatar('dela.jpg'); };
      img.onerror = function(){};
      img.src = 'dela.jpg';
    }
    notifAvatar.addEventListener('click', function(){ document.getElementById('avatarInput').click(); });
    document.getElementById('avatarInput').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function(ev){
        applyAvatar(ev.target.result);
        try { localStorage.setItem('gfPhoto', ev.target.result); } catch(err){}
      };
      r.readAsDataURL(file);
    });

    // ===== Corações caindo (sutil) =====
    (function heartsRain(){
      var layer = document.getElementById('hearts');
      function spawn(){
        var h = document.createElement('span');
        h.className = 'heart-fall';
        h.textContent = '🩷';
        var size = 12 + Math.random() * 12;      // 12–24px
        var dur = 9 + Math.random() * 5;          // 9–14s (bem devagar)
        h.style.left = (5 + Math.random() * 90) + 'vw';
        h.style.fontSize = size + 'px';
        h.style.animationDuration = dur + 's';
        layer.appendChild(h);
        setTimeout(function(){ h.remove(); }, dur * 1000 + 300);
      }
      setInterval(spawn, 3200);                    // 1 coração a cada ~3s
      spawn();
    })();

    // ===== Senha de desbloqueio =====
    (function pinLock(){
      var layer = document.getElementById('pinLayer');
      var dots = layer.querySelectorAll('.pin-dots .d');
      var entry = '';

      function getPin(){
        var p = null;
        try { p = localStorage.getItem('pin'); } catch(e){}
        return (p && p.length === 4) ? p : '0102'; // senha padrão: 0102
      }
      function setPin(p){ try { localStorage.setItem('pin', p); } catch(e){} }

      function render(){
        for (var i = 0; i < dots.length; i++){
          if (i < entry.length) dots[i].classList.add('on');
          else dots[i].classList.remove('on');
        }
      }
      function open(){ layer.classList.add('show'); entry=''; render(); }
      function close(){ layer.classList.remove('show'); entry=''; render(); }

      // Chamado pelo app ao reexibir a tela de bloqueio (reseta o teclado)
      window.resetLock = function(){ close(); };
      // Chamado pelo app se a digital falhar/for cancelada (mostra a senha reserva)
      window.showPin = function(){ open(); };

      function success(){
        if (window.AndroidLock && typeof window.AndroidLock.unlock === 'function'){
          window.AndroidLock.unlock();   // no app: sai da tela de bloqueio
        } else {
          close();                        // no navegador: apenas fecha o teclado
        }
      }
      function fail(){
        layer.classList.add('err');
        setTimeout(function(){ layer.classList.remove('err'); entry=''; render(); }, 420);
      }

      layer.addEventListener('click', function(e){
        var k = e.target.getAttribute('data-k');
        if (!k) return;
        if (k === 'del'){ entry = entry.slice(0, -1); render(); return; }
        if (k === 'chg'){
          var atual = prompt('Senha atual (4 dígitos):');
          if (atual === getPin()){
            var nova = prompt('Nova senha (4 dígitos):');
            if (nova && /^\d{4}$/.test(nova)){ setPin(nova); alert('Senha alterada! 💕'); }
            else alert('A senha precisa ter 4 números.');
          } else if (atual !== null){ alert('Senha atual incorreta.'); }
          return;
        }
        if (/^[0-9]$/.test(k) && entry.length < 4){
          entry += k; render();
          if (entry.length === 4){
            if (entry === getPin()) setTimeout(success, 120);
            else setTimeout(fail, 120);
          }
        }
      });

      // "usar senha": abre o teclado (reserva)
      var usePin = document.getElementById('usePin');
      if (usePin) usePin.addEventListener('click', open);
      var startY = null;
      document.addEventListener('touchstart', function(e){
        if (layer.classList.contains('show')) return;
        startY = e.touches[0].clientY;
      }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (startY === null || layer.classList.contains('show')) return;
        var endY = (e.changedTouches[0] || {}).clientY || startY;
        if (startY - endY > 70) open();
        startY = null;
      }, {passive:true});
      // Deslizar para baixo fecha o teclado
      var sY2 = null;
      layer.addEventListener('touchstart', function(e){ sY2 = e.touches[0].clientY; }, {passive:true});
      layer.addEventListener('touchend', function(e){
        if (sY2 === null) return;
        var endY = (e.changedTouches[0] || {}).clientY || sY2;
        if (endY - sY2 > 90) close();
        sY2 = null;
      }, {passive:true});
    })();

    // ===== Player do Spotify (música tocando) =====
    (function nowPlaying(){
      var np = document.getElementById('nowPlaying');
      var art = document.getElementById('npArt');
      var title = document.getElementById('npTitle');
      var artist = document.getElementById('npArtist');
      var playBtn = document.getElementById('npPlay');
      var lastArt = '';

      // Recebe os dados vindos do app: {title, artist, art, playing, active, hasAccess}
      window.setNowPlaying = function(data){
        try { if (typeof data === 'string') data = JSON.parse(data); } catch(e){ return; }
        if (!data) return;

        if (data.hasAccess === false){
          np.classList.remove('hidden');
          title.textContent = 'Conectar o Spotify';
          artist.textContent = 'toque aqui para ativar 🎵';
          playBtn.textContent = '▶';
          art.innerHTML = '<span class="np-note">🎵</span>'; lastArt='';
          np.dataset.connect = '1';
          return;
        }
        np.dataset.connect = '';

        if (!data.active || !data.title){
          np.classList.add('hidden');
          return;
        }
        np.classList.remove('hidden');
        title.textContent = data.title;
        artist.textContent = data.artist || '';
        playBtn.textContent = data.playing ? '⏸' : '▶';
        if (data.art && data.art !== lastArt){
          art.style.backgroundImage = "url('" + data.art + "')";
          art.innerHTML = ''; lastArt = data.art;
        } else if (!data.art && lastArt){
          art.style.backgroundImage = ''; art.innerHTML = '<span class="np-note">🎵</span>'; lastArt='';
        }
      };

      np.addEventListener('click', function(e){
        // Se ainda não tem acesso, o toque abre a permissão
        if (np.dataset.connect === '1'){
          if (window.AndroidLock && window.AndroidLock.connectMedia) window.AndroidLock.connectMedia();
          return;
        }
        var m = e.target.getAttribute('data-m');
        if (m && window.AndroidLock && window.AndroidLock.media){
          window.AndroidLock.media(m);
        }
      });
    })();

    // ===== Próximo alarme (vindo do app) =====
    window.setAlarm = function(t){
      var el = document.getElementById('alarm');
      var tt = document.getElementById('alarmTime');
      if (!el || !tt) return;
      if (t && t.length){ tt.textContent = t; el.classList.remove('hidden'); }
      else { el.classList.add('hidden'); }
    };

    // ===== Notificação aleatória dela (sem poluir) =====
    (function randomNotif(){
      var n2 = document.getElementById('notif2');
      var hideT = null;
      function show(){
        var now = new Date();
        document.getElementById('notif2Time').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
        document.getElementById('notif2Msg').textContent = rnd(TEAMO);
        n2.classList.remove('hidden');
        n2.classList.remove('show-pop'); void n2.offsetWidth; n2.classList.add('show-pop');
        clearTimeout(hideT);
        hideT = setTimeout(function(){ n2.classList.add('hidden'); }, 13000); // some após ~13s
      }
      function schedule(){
        var delay = 70000 + Math.random() * 110000; // aparece a cada ~1 a 3 min
        setTimeout(function(){ show(); schedule(); }, delay);
      }
      schedule();
    })();

    // ===== Bilhetinhos escondidos =====
    (function bilhetes(){
      var btn = document.getElementById('noteBtn');
      var pop = document.getElementById('notePop');
      var hideT = null;
      btn.addEventListener('click', function(){
        pop.textContent = '💌 ' + rnd(NOTES);
        pop.classList.remove('hidden');
        void pop.offsetWidth;
        pop.classList.add('show');
        clearTimeout(hideT);
        hideT = setTimeout(function(){
          pop.classList.remove('show');
          setTimeout(function(){ pop.classList.add('hidden'); }, 260);
        }, 4200);
      });
      pop.addEventListener('click', function(){
        pop.classList.remove('show');
        setTimeout(function(){ pop.classList.add('hidden'); }, 260);
      });
    })();

    // ===== Início =====
    loadPhoto();
    loadAvatar();
    tick();
    setInterval(tick, 1000);
    // (Sem wakeLock: a tela deve apagar normalmente quando o usuário desligar)
  </script>
</body>
</html>
