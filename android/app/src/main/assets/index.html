<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Erica e Erick 💕</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --accent: #ff5c8a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Foto de fundo */
    #bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }
    /* Leve escurecimento só nas pontas, para o texto respirar */
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg,
        rgba(0,0,0,.45) 0%,
        rgba(0,0,0,.05) 20%,
        rgba(0,0,0,0) 45%,
        rgba(0,0,0,.15) 80%,
        rgba(0,0,0,.55) 100%);
    }

    #content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--safe-top) + 32px) 22px calc(var(--safe-bottom) + 20px);
    }

    /* Relógio + data */
    #clock {
      font-size: clamp(66px, 22vw, 120px);
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 2px 22px rgba(0,0,0,.45);
      font-variant-numeric: tabular-nums;
    }
    #date {
      margin-top: 6px;
      font-size: clamp(14px, 4.2vw, 19px);
      font-weight: 500;
      opacity: .95;
      text-shadow: 0 1px 12px rgba(0,0,0,.55);
    }

    /* Notificação estilo WhatsApp */
    .notif {
      width: 100%;
      max-width: 440px;
      margin-top: 26px;
      background: rgba(250,250,250,.86);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 20px;
      padding: 11px 13px 13px;
      color: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }
    .notif-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .notif-app { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #3a3a3a; }
    .wa-icon {
      width: 19px; height: 19px; border-radius: 5px; background: #25D366;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .notif-time { font-size: 12.5px; color: #666; font-variant-numeric: tabular-nums; }
    .notif-body { display: flex; align-items: center; gap: 11px; }
    .notif-avatar {
      width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
      background: linear-gradient(135deg,#ffb3c9,#ff5c8a) center/cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
      cursor: pointer; overflow: hidden;
      display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
    }
    .notif-avatar:active { transform: scale(.94); }
    .notif-text { min-width: 0; }
    .notif-name {
      font-size: 15px; font-weight: 700; color: #000; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .notif-msg { font-size: 14.5px; color: #1c1c1c; line-height: 1.25; }

    .spacer { flex: 1 1 auto; }

    /* Rodapé mínimo: nomes + contador discreto */
    .footer { text-align: center; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
    .footer .names {
      font-size: clamp(15px, 4.4vw, 18px);
      font-weight: 600;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .footer .names .h { color: var(--accent); font-size: .85em; }
    .footer .count {
      margin-top: 4px;
      font-size: 12.5px;
      opacity: .85;
      font-variant-numeric: tabular-nums;
    }

    /* Botão trocar foto de fundo */
    #photoBtn {
      position: absolute;
      top: calc(var(--safe-top) + 14px);
      right: 14px;
      z-index: 3;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: .5; transition: opacity .2s;
    }
    #photoBtn:active { opacity: 1; transform: scale(.95); }

    /* Corações caindo — bem sutil */
    #hearts { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .heart-fall {
      position: absolute; top: -8%;
      will-change: transform, opacity;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0%   { transform: translateY(-10vh); opacity: 0; }
      15%  { opacity: .8; }
      85%  { opacity: .8; }
      100% { transform: translateY(112vh); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-fall { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="bg"></div>
    <div id="overlay"></div>
    <div id="hearts"></div>

    <button id="photoBtn" title="Trocar foto de fundo" aria-label="Trocar foto de fundo">📷</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" />
    <input type="file" id="avatarInput" accept="image/*" style="display:none" />

    <div id="content">
      <div id="clock">--:--</div>
      <div id="date">carregando…</div>

      <div class="notif" id="notif">
        <div class="notif-header">
          <div class="notif-app"><span class="wa-icon">💬</span> WhatsApp</div>
          <span class="notif-time" id="notifTime">agora</span>
        </div>
        <div class="notif-body">
          <div class="notif-avatar" id="notifAvatar" title="Trocar foto dela">💕</div>
          <div class="notif-text">
            <div class="notif-name">amor da minha vida 💕</div>
            <div class="notif-msg" id="notifMsg">Bom dia meu bem ☀️</div>
          </div>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="footer">
        <div class="names">Erica <span class="h">❤</span> Erick</div>
        <div class="count" id="count">juntos há 555 dias · desde 01/02/2025</div>
      </div>
    </div>
  </div>

  <script>
    var START_DATE = new Date(2025, 1, 1, 0, 0, 0); // 01/02/2025

    var DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    function pad(n){ return n < 10 ? '0' + n : '' + n; }
    function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

    function greeting(now){
      var h = now.getHours();
      if (h >= 5 && h < 12)  return 'Bom dia meu bem ☀️';
      if (h >= 12 && h < 18) return 'Boa tarde meu bem 🌤️';
      return 'Boa noite meu bem 🌙';
    }

    function tick(){
      var now = new Date();

      document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
      document.getElementById('date').textContent =
        cap(DIAS[now.getDay()]) + ', ' + now.getDate() + ' de ' + MESES[now.getMonth()] + ' de ' + now.getFullYear();

      document.getElementById('notifMsg').textContent = greeting(now);
      document.getElementById('notifTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());

      var totalDays = Math.floor((now - START_DATE) / 86400000);
      document.getElementById('count').textContent =
        'juntos há ' + totalDays.toLocaleString('pt-BR') + ' dias · desde 01/02/2025';
    }

    // ===== Foto de fundo =====
    var bg = document.getElementById('bg');
    function applyPhoto(src){ bg.style.backgroundImage = "url('" + src + "')"; }
    function loadPhoto(){
      var saved = null;
      try { saved = localStorage.getItem('couplePhoto'); } catch(e){}
      if (saved) { applyPhoto(saved); return; }
      var img = new Image();
      img.onload = function(){ applyPhoto('foto.jpg'); };
      img.onerror = function(){
        bg.style.background = 'radial-gradient(120% 120% at 30% 20%, #3a1c3f 0%, #1a1030 55%, #0a0812 100%)';
      };
      img.src = 'foto.jpg';
    }
    document.getElementById('photoBtn').addEventListener('click', function(){
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function(ev){
        applyPhoto(ev.target.result);
        try { localStorage.setItem('couplePhoto', ev.target.result); } catch(err){}
      };
      r.readAsDataURL(file);
    });

    // ===== Foto dela (avatar) =====
    var notifAvatar = document.getElementById('notifAvatar');
    function applyAvatar(src){ notifAvatar.style.backgroundImage = "url('" + src + "')"; notifAvatar.textContent = ''; }
    function loadAvatar(){
      var saved = null;
      try { saved = localStorage.getItem('gfPhoto'); } catch(e){}
      if (saved) { applyAvatar(saved); return; }
      var img = new Image();
      img.onload = function(){ applyAvatar('dela.jpg'); };
      img.onerror = function(){};
      img.src = 'dela.jpg';
    }
    notifAvatar.addEventListener('click', function(){ document.getElementById('avatarInput').click(); });
    document.getElementById('avatarInput').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function(ev){
        applyAvatar(ev.target.result);
        try { localStorage.setItem('gfPhoto', ev.target.result); } catch(err){}
      };
      r.readAsDataURL(file);
    });

    // ===== Corações caindo (sutil) =====
    (function heartsRain(){
      var layer = document.getElementById('hearts');
      function spawn(){
        var h = document.createElement('span');
        h.className = 'heart-fall';
        h.textContent = '🩷';
        var size = 12 + Math.random() * 12;      // 12–24px
        var dur = 9 + Math.random() * 5;          // 9–14s (bem devagar)
        h.style.left = (5 + Math.random() * 90) + 'vw';
        h.style.fontSize = size + 'px';
        h.style.animationDuration = dur + 's';
        layer.appendChild(h);
        setTimeout(function(){ h.remove(); }, dur * 1000 + 300);
      }
      setInterval(spawn, 3200);                    // 1 coração a cada ~3s
      spawn();
    })();

    // ===== Início =====
    loadPhoto();
    loadAvatar();
    tick();
    setInterval(tick, 1000);

    if ('wakeLock' in navigator) {
      var wl = null;
      async function reqWake(){ try { wl = await navigator.wakeLock.request('screen'); } catch(e){} }
      reqWake();
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') reqWake();
      });
    }
  </script>
</body>
</html>
